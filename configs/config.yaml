# ---------------------------------------------------------------------------
# Siamese Defect Detection + Classification — base configuration
# ---------------------------------------------------------------------------

experiment:
  name: siamese_defect_v1
  seed: 42
  output_dir: runs/siamese_defect_v1
  amp: true                     # mixed precision (fp16) training
  grad_accum_steps: 2           # effective batch = batch_size * grad_accum_steps

data:
  # self-contained dataset assembled by scripts/convert_coco_to_siamese.py --copy-to
  # (images/reference copied alongside the annotations, see data/prepared/)
  root: data/prepared/
  reference_dir: data/prepared/reference
  images_dir: data/prepared/images
  train_split: data/prepared/annotations/train.json
  val_split: data/prepared/annotations/val.json
  test_split: data/prepared/annotations/test.json
  image_size: [800, 800]        # (H, W), letterboxed, stride-32 aligned
  num_workers: 8
  pin_memory: true

  defect_classes:
    - crack
    - ghosting
    - spot

  pair_sampling:
    positive_ratio: 0.5          # fraction of defective (positive) pairs per batch
    hard_negative_ratio: 0.3     # fraction of "good vs good" pairs drawn from hard-negative pool
    hard_negative_pool_size: 5000
    hard_negative_refresh_every_epochs: 1

model:
  backbone:
    name: resnet50            # options: resnet34, resnet50, convnext_tiny, mobilenet_v3_large
    pretrained: true
    frozen_stages: 1           # freeze stem + stage1 for the first N epochs
  fpn:
    out_channels: 256
    levels: [p3, p4, p5, p6, p7]
  comparison:
    mode: concat_diff_residual   # options: concat, abs_diff, subtract, cosine, concat_diff_residual, cross_attention
    reduce_channels: 256
    use_cosine_channel: true
  det_head:
    num_convs: 4
  embedding:
    dim: 256
    pooling: gem                 # generalized-mean pooling

loss:
  weights:
    detection: 1.0
    classification: 1.0
    siamese: 0.5
  detection:
    focal_alpha: 0.25
    focal_gamma: 2.0
    box_loss: ciou
    centerness: bce
  classification:
    label_smoothing: 0.05
  siamese:
    type: contrastive            # options: contrastive, triplet, cosine_embedding, infonce
    margin: 1.0
    temperature: 0.07            # used only if type == infonce

train:
  optimizer: adamw
  lr: 0.0002
  weight_decay: 0.05
  batch_size: 8
  epochs: 120
  warmup_epochs: 3
  scheduler: cosine
  min_lr_ratio: 0.01
  ema_decay: 0.999
  early_stopping:
    metric: val/box_mAP
    patience: 15
    mode: max
  hard_negative_mining:
    enabled: true
    start_epoch: 10
    top_k_fraction: 0.3

inference:
  score_threshold: 0.5
  nms_iou_threshold: 0.5
  max_detections: 50
  anomaly_embedding_threshold: 0.35   # cosine-distance threshold for unknown-defect flagging

export:
  onnx_opset: 17
  input_names: [reference, input]
  output_names: [boxes, scores, labels, embedding_distance]
  dynamic_axes: false           # fixed shape preferred for OpenVINO + industrial line
  precision: [fp32, fp16, int8]
